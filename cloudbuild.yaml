# Cloud Build configuration for automated deployments
# This file can be used with Cloud Build triggers for CI/CD
# 
# NOTE: Make sure Dockerfiles are committed to your repository
# - Dockerfile (frontend) should be in the root directory
# - backend/Dockerfile (backend) should be in the backend directory

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/assessly-backend'
      - 'backend'
    id: 'build-backend'
    dir: '.'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/assessly-backend']
    id: 'push-backend'
    waitFor: ['build-backend']

  # Deploy backend (optional - remove if deploying manually)
  # NOTE: Set environment variables and secrets in Cloud Run service directly via web UI
  # Or uncomment the lines below to set them during deployment
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'assessly-backend'
      - '--image=gcr.io/$PROJECT_ID/assessly-backend'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/assessly-frontend'
      - '.'
    id: 'build-frontend'
    dir: '.'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/assessly-frontend']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Deploy frontend (optional - remove if deploying manually)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'assessly-frontend'
      - '--image=gcr.io/$PROJECT_ID/assessly-frontend'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/assessly-backend'
  - 'gcr.io/$PROJECT_ID/assessly-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'

