# Cloud Build configuration for automated deployments
# This file can be used with Cloud Build triggers for CI/CD
# 
# NOTE: Make sure Dockerfiles are committed to your repository
# - Dockerfile (frontend) should be in the root directory
# - backend/Dockerfile (backend) should be in the backend directory

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/assessly-backend'
      - 'backend'
    id: 'build-backend'
    dir: '.'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/assessly-backend']
    id: 'push-backend'
    waitFor: ['build-backend']

  # Deploy backend (commented out - deploy manually via Cloud Run console)
  # NOTE: Deploy manually to avoid permission issues and set environment variables
  # After image is built, go to Cloud Run console and deploy with environment variables
  # - name: 'gcr.io/cloud-builders/gcloud'
  #   args:
  #     - 'run'
  #     - 'deploy'
  #     - 'assessly-backend'
  #     - '--image=gcr.io/$PROJECT_ID/assessly-backend'
  #     - '--platform=managed'
  #     - '--region=us-central1'
  #     - '--allow-unauthenticated'
  #     - '--memory=2Gi'
  #     - '--cpu=2'
  #     - '--timeout=300'
  #     - '--max-instances=10'
  #     - '--min-instances=0'
  #     - '--port=8000'
  #   id: 'deploy-backend'
  #   waitFor: ['push-backend']

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/assessly-frontend'
      - '.'
    id: 'build-frontend'
    dir: '.'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/assessly-frontend']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Deploy frontend (commented out - deploy manually via Cloud Run console)
  # - name: 'gcr.io/cloud-builders/gcloud'
  #   args:
  #     - 'run'
  #     - 'deploy'
  #     - 'assessly-frontend'
  #     - '--image=gcr.io/$PROJECT_ID/assessly-frontend'
  #     - '--platform=managed'
  #     - '--region=us-central1'
  #     - '--allow-unauthenticated'
  #     - '--memory=1Gi'
  #     - '--cpu=1'
  #     - '--timeout=60'
  #     - '--max-instances=10'
  #     - '--min-instances=0'
  #   id: 'deploy-frontend'
  #   waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/assessly-backend'
  - 'gcr.io/$PROJECT_ID/assessly-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'

